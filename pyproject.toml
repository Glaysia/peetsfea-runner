[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "peetsfea-runner"
version = "2026.04.07.3"
description = "Function-only AEDT Slurm pipeline skeleton"
requires-python = "==3.12.*"
dependencies = [
  "cadquery",
  "duckdb>=1.5",
  "ocp-vscode>=3.1.2",
  "pexpect>=4.9",
  "peetsfea @ git+file:///home/peets/git/peetsfea.git@0.3.5",
  "psutil",
  "pandas",
  "pyaedt[graphics]==0.25.1"
]

[project.optional-dependencies]
dev = [
  "mypy>=1.11",
  "pytest>=8",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["peetsfea_runner*"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["peetsfea_runner"]
# 외부 라이브러리는 타입 스텁이 없으므로 import 누락만 무시(우리 코드 타입은 strict 유지).
[[tool.mypy.overrides]]
module = [
  "pyaedt.*",
  "ansys.*",
  "cadquery.*",
  "ocp_vscode.*",
  "pexpect.*",
  "peetsfea.*",
  "psutil",
  "duckdb",
]
ignore_missing_imports = true
