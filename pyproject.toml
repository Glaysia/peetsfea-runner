[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "peetsfea-runner"
version = "2026.04.07.3"
description = "Function-only AEDT Slurm pipeline skeleton"
requires-python = "==3.12.*"
dependencies = [
  "cadquery",
  "duckdb>=1.5",
  "ocp-vscode>=3.1.2",
  "pexpect>=4.9",
  "peetsfea @ git+file:///home/peets/git/peetsfea.git@v0.3.9.0",
  "psutil",
  "pandas",
  "pyaedt[graphics]==0.25.1",
  # 데이터플레인 갈아엎기(PLANS/data_plane_overhaul.html): read API = FastAPI/uvicorn + Arrow IPC 스트리밍.
  # pyarrow는 cadquery가 이미 끌어옴. psycopg3 서버사이드 커서로 상수메모리 스트림.
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pyarrow>=17",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.11",
  "pytest>=8",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["peetsfea_runner*"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["peetsfea_runner"]
# 외부 라이브러리는 타입 스텁이 없으므로 import 누락만 무시(우리 코드 타입은 strict 유지).
[[tool.mypy.overrides]]
module = [
  "pyaedt.*",
  "ansys.*",
  "cadquery.*",
  "ocp_vscode.*",
  "pexpect.*",
  "peetsfea.*",
  "psutil",
  "duckdb",
]
ignore_missing_imports = true
